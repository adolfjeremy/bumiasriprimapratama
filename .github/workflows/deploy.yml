name: Deploy Bumi Asri to VPS

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      # Setup SSH Native bawaan kamu (Sudah Sempurna)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # PERBAIKAN 1: Satukan file ke folder staging agar rsync tidak bingung & tidak menghapus .env
      - name: Prepare Staging Folder
        run: |
          mkdir staging
          cp -r dist/* staging/
          cp package.json package-lock.json staging/

      # PERBAIKAN 2: Deploy dari folder staging dengan filter eksklusi yang patuh
      - name: Deploy
        run: |
          rsync -avz --delete --exclude='node_modules' --exclude='.env' \
            staging/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/static/bumiasriprimapratama.com/

      # PERBAIKAN 3: Paksa PM2 hapus memori lama dan daftarkan ulang flag --env-file
      - name: Production Install & PM2 Restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/static/bumiasriprimapratama.com
            
            # Install library runtime produksi
            npm install --omit=dev --legacy-peer-deps
            
            # Paksa bebaskan port jika ada proses yang menggantung
            sudo fuser -k 4321/tcp || true
            
            # SOLUSI UTAMA: Hapus instansiasi lama dari memori PM2 terlebih dahulu
            pm2 delete bapp-frontend || true
            
            # Daftarkan ulang secara segar agar flag --env-file aktif 100%
            HOST=127.0.0.1 PORT=4321 pm2 start server/entry.mjs --name "bapp-frontend" --node-args="--env-file=.env"
            
            # Simpan konfigurasi PM2 yang baru
            pm2 save
          EOF