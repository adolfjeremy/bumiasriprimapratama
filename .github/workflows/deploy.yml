name: Deploy Bumi Asri to VPS

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}

      # Setup SSH Native bawaan kamu (Sudah Sempurna)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # MODIFIKASI: Ikut kirim package.json & amankan node_modules dari rsync --delete
      - name: Deploy
        run: |
          rsync -avz --delete --exclude='node_modules' \
            dist/ package.json package-lock.json \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/static/bumiasriprimapratama.com/

      # TAMBAHAN: Eksekusi npm install produksi & restart PM2 via SSH native
      - name: Production Install & PM2 Restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/static/bumiasriprimapratama.com
            
            # Install hanya library runtime (termasuk piccolore), abaikan devDependencies
            npm install --omit=dev --legacy-peer-deps
            
            # Restart Astro Server (mengarah ke server/entry.mjs sesuai struktur rsync kamu)
            pm2 restart bapp-frontend || HOST=127.0.0.1 PORT=4321 pm2 start server/entry.mjs --name "bapp-frontend"
            
            # Simpan konfigurasi PM2
            pm2 save
          EOF